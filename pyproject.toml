[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "inspire-matcher"
version = "9.0.48"
description = "Find the records in INSPIRE most similar to a given record or reference."
authors = [{name = "CERN", email = "admin@inspirehep.net"}]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
[project.urls]
Repository = "https://github.com/inspirehep/inspire-matcher"

[project.entry-points."invenio_base.apps"]
inspire_matcher = "inspire_matcher:InspireMatcher"

[project.optional-dependencies]
tests = ["pytest>=8.3.5", "pytest-cov>=2.5.1,<3.0"]
dev = ["pre-commit>=4.2.0"]
all = ["pytest>=8.3.5", "pytest-cov>=2.5.1,<3.0", "pre-commit>=4.2.0"]
opensearch3 = ["opensearch-py>=3.0.0,<4.0.0", "opensearch-dsl>=2.0.0,<3.0.0"]

[tool.poetry]
include = [
    {path = "tests", format = "sdist"},
    {path = "setup.cfg", format = "sdist"},
]

[tool.poetry.dependencies]
inspire-json-merger = "^11.0.46"
inspire-utils = "^3.0.70"
invenio-search = ">=1.2.3"
invenio-base = ">=1.2.3,<2.0.0"
pyyaml = ">=6.0,<7.0"
# invenio-search 2.4.x imports pkg_resources.
setuptools = "<84"

[tool.coverage.run]
include = ["inspire_matcher/*.py"]

[tool.pytest.ini_options]
addopts = "--cov=inspire_matcher --cov-report=term-missing:skip-covered"
